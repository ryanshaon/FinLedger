[project]
name = "finledger-ai"
version = "0.1.0"
description = "FinLedger AP Person 1: invoice contracts, extraction, retrieval and AI usage controls"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Preserve the existing imports shared by the extraction and control contracts.
packages = ["contracts", "extract", "mapper", "memory", "rag", "safety", "summary", "usage"]
exclude = ["**/tests/**", "contracts/golden/**"]
