[project]
name = "finledger-platform"
version = "0.1.0"
description = "FinLedger AP - Person 2: tenancy, intake doors, ingest, object store, documents, file prep"
requires-python = ">=3.12"
dependencies = [
    "finledger-ai",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "markitdown[pdf,xlsx]>=0.1",
    "pdfplumber>=0.11",
    "pillow>=10",
    "cryptography>=43",
    "PyJWT[crypto]>=2.10,<3",
]

[tool.uv.sources]
finledger-ai = { path = "../packages", editable = true }

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "boto3>=1.34", "moto[s3]>=5"]

[project.scripts]
finledger-platform = "finledger_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finledger_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
