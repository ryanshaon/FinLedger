[project]
name = "finledger-control-ui"
version = "0.1.0"
description = "FinLedger AP Person 3 — deterministic controls, workflow and review UI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  "finledger-platform",
]

[tool.uv.sources]
finledger-platform = { path = "../person2_platform", editable = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]

[project.scripts]
finledger-control = "finledger_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finledger_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]

